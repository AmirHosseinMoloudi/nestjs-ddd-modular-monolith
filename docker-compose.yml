services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nestjs-todo-backend
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/todo.sqlite
      - JWT_SECRET=production-grade-super-secret-key-32chars-min!
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=nestjs-todo-backend
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (r) => { if (r.statusCode !== 200) process.exit(1); })\""]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - otel-collector
    networks:
      - nestjs_todo_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nestjs-todo-frontend
    restart: unless-stopped
    ports:
      - "3011:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NUXT_PUBLIC_API_BASE=http://localhost:3010
      - NUXT_PUBLIC_GRAFANA_URL=http://localhost:3012
    depends_on:
      - backend
    networks:
      - nestjs_todo_net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: nestjs-todo-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4320:4317" # OTLP gRPC host port
      - "4321:4318" # OTLP HTTP host port
      - "8889:8889" # Prometheus metrics exporter
    depends_on:
      - tempo
    networks:
      - nestjs_todo_net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nestjs-todo-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - nestjs_todo_net

  tempo:
    image: grafana/tempo:2.6.0
    container_name: nestjs-todo-tempo
    restart: unless-stopped
    user: root
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "3201:3200" # Tempo HTTP host port
    networks:
      - nestjs_todo_net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: nestjs-todo-grafana
    restart: unless-stopped
    ports:
      - "3012:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards/json
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    networks:
      - nestjs_todo_net

networks:
  nestjs_todo_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  sqlite_data:
  prometheus_data:
  tempo_data:
  grafana_data:
